<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelentkezés eseményre</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Jelentkezés eseményre</h1>

            <div>
                <a href="/" class="btn btn-primary">
                    Események
                </a>
                <a href="/create-event" class="btn btn-primary">
                    Új esemény
                </a>
                <a href="/register-page" class="btn btn-primary">
                    Jelentkezés eseményre
                </a>
            </div>
        </div>

        <div class="container mt-5">

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="card shadow">

                        <div class="card-header text-center">
                            <h2>Jelentkezés</h2>
                        </div>

                        <div class="card-body">

                            <div class="mb-3">

                                <label class="form-label">
                                    Teljes név
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Kis Pista">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="email@cím.hu">

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Esemény neve
                                </label>

                                <select
                                    id="eventSelect"
                                    class="form-select">
                                </select>

                            </div>

                            <div class="d-grid">

                                <button
                                    class="btn btn-primary"
                                    onclick="registerToEvent()">

                                    Ott leszek

                                </button>

                            </div>

                            <div
                                id="message"
                                class="mt-3 text-center">
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='register.js') }}"></script>

</body>

</html>
