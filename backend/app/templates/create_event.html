<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esemény létrehozása</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Esemény létrehozása</h1>

            <div>
                <a href="/" class="btn btn-primary">
                    Események
                </a>
                <a href="/create-event" class="btn btn-primary">
                    Új esemény
                </a>
                <a href="/register-page" class="btn btn-primary">
                    Jelentkezés eseményre
                </a>
            </div>
        </div>

        <div class="container mt-5">

            <div class="row justify-content-center">

                <div class="col-md-8 col-lg-6">

                    <div class="card shadow">

                        <div class="card-header text-center">
                            <h2>Új Esemény létrehozása</h2>
                        </div>

                        <div class="card-body">

                            <div class="mb-3">

                                <label class="form-label">
                                    Esemény neve
                                </label>

                                <input
                                    type="text"
                                    id="title"
                                    class="form-control"
                                    placeholder="Adj nevet az eseménynek">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Leírása
                                </label>

                                <textarea
                                    id="description"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Adj esemény leírást"></textarea>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Helyszín
                                </label>

                                <input
                                    type="text"
                                    id="location"
                                    class="form-control"
                                    placeholder="Esemény helyszín">

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Dátum/Idő
                                </label>

                                <input
                                    type="datetime-local"
                                    id="date"
                                    class="form-control">

                            </div>

                            <div class="d-grid">

                                <button
                                    class="btn btn-success"
                                    onclick="handleCreateEvent()">

                                    Létrehozás

                                </button>

                            </div>

                            <div
                                id="message"
                                class="mt-3 text-center">
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='create_event.js') }}"></script>

</body>

</html>
