<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-header text-center">
                        <h2>Create New Event</h2>
                    </div>

                    <div class="card-body">

                        <div class="mb-3">

                            <label class="form-label">
                                Event Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                placeholder="Enter event title">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="4"
                                placeholder="Enter event description"></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                class="form-control"
                                placeholder="Enter location">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Date and Time
                            </label>

                            <input
                                type="datetime-local"
                                id="date"
                                class="form-control">

                        </div>

                        <div class="d-grid">

                            <button
                                class="btn btn-success"
                                onclick="createEvent()">

                                Create Event

                            </button>

                        </div>

                        <div
                            id="message"
                            class="mt-3 text-center">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='create_event.js') }}"></script>

</body>

</html>
